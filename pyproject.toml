[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-ocpp-sim"
dynamic = ["version"]
description = "Free, open-source OCPP charging station (charge point) simulator for OCPP 1.6J and 2.0.1 with a live web UI, for Windows, Linux and Docker. Test a CSMS or EMS, including Smart Charging, without real EV chargers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["simulator", "ocpp", "ocpp16", "ev-charging", "charge-point", "csms", "smart-charging", "ocpp201", "ocpp-simulator", "charging-station", "emulator"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Web shell, standard routes, config / engine / CLI helpers. 1.x only adds compatible features.
  "sme-sim-common>=1.1,<2",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2",
  "pyyaml",
  # OCPP-J transport (WebSocket client); the RPC layer and message models are written in-house.
  "websockets>=17,<18",
  # Security profile 3 / certificate management (CSR generation, PEM parsing; plan §11.1 Q12). 42+: *_utc.
  "cryptography>=42",
]

[project.optional-dependencies]
# ocpp: dev-only CSMS peer for integration tests and screenshots; jsonschema: checks against the OCA schemas.
# schema: optional runtime check of 2.0.1 payloads against user-supplied JSON schemas (protocol/v201/schema.py).
# A dateTime "format" is only checked when rfc3339-validator is installed as well.
schema = ["jsonschema"]
dev = ["pytest", "httpx", "ocpp==2.1.0", "jsonschema", "playwright", "pillow"]

[project.urls]
Homepage = "https://github.com/smartedge-tech-dev/sme-ocpp-sim"
Documentation = "https://smartedge-tech-dev.github.io/sme-ocpp-sim/"
Changelog = "https://github.com/smartedge-tech-dev/sme-ocpp-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/smartedge-tech-dev/sme-ocpp-sim/issues"

[project.scripts]
sme-ocpp-sim = "sme_ocpp_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sme_ocpp_sim.__version__" }

[tool.setuptools]
# configs/ ships inside the wheel as sme_ocpp_sim/configs so that a pip / pipx install has the demo config
# (source tree, Docker image and Windows exe: configs/ beside the package). List new subpackages here.
packages = [
  "sme_ocpp_sim",
  "sme_ocpp_sim.charging",
  "sme_ocpp_sim.csms",
  "sme_ocpp_sim.protocol",
  "sme_ocpp_sim.protocol.v16",
  "sme_ocpp_sim.protocol.v201",
  "sme_ocpp_sim.rpc",
  "sme_ocpp_sim.runtime",
  "sme_ocpp_sim.configs",
]
package-dir = { "sme_ocpp_sim.configs" = "configs" }
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]

[tool.setuptools.package-data]
sme_ocpp_sim = ["static/**/*"]
"sme_ocpp_sim.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The load test (plan §6.4) runs only on request: pytest -m load
addopts = "-m 'not load'"
markers = ["load: long-running multi-charger load test (excluded by default; run with -m load)"]
