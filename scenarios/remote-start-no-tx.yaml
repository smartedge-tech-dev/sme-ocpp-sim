# Anomaly check for a CSMS (v0.3 M2 impairments): DEMO-16 accepts a RemoteStartTransaction but never starts the
# transaction. Send the RemoteStartTransaction from the CSMS (Mini CSMS dialog, or your CSMS) while the
# scenario waits; the scenario then checks that no StartTransaction follows.
format: ocppsim-scenario/1
name: remote-start-no-tx
tracks:
  - charger: DEMO-16
    steps:
      - expect: {state: {online: true}}
        within: 30s
      - {do: impair, impairments: {remote_start: accept_no_tx}}
      - {do: plug, connector: 1}
      - await_csms:
          action: RemoteStartTransaction
          prompt: Send RemoteStartTransaction to DEMO-16 from the CSMS now
        within: 5m
      - expect_not: {dir: tx, action: StartTransaction}
        within: 20s
      - {do: impair, impairments: {}}
      - {do: unplug, connector: 1}
