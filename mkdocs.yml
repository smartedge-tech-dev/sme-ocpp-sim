site_name: SME OCPPSim
site_url: https://smartedge-tech-dev.github.io/sme-ocpp-sim/
site_description: Free, open-source OCPP charging station (charge point) simulator for OCPP 1.6J and 2.0.1 with a live web UI, for Windows, Linux and Docker. Test a CSMS or EMS, including Smart Charging, without real EV chargers.
repo_url: https://github.com/smartedge-tech-dev/sme-ocpp-sim
repo_name: smartedge-tech-dev/sme-ocpp-sim
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Folder structure: docs/en/*.md, docs/ja/*.md, docs/zh/*.md (same file names in every folder).
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: 無料・オープンソースの OCPP 充電器（チャージポイント）シミュレーター。OCPP 1.6J / 2.0.1 に対応し、Windows / Linux / Docker で動作します。実機の充電器なしで、Smart Charging を含む CSMS・EMS の試験ができます。
          nav_translations:
            Home: ホーム
            Getting started: はじめに
            Configuration: 設定
            Reference: リファレンス
            About: 概要
        - locale: zh
          name: 简体中文
          build: true
          site_description: 免费开源的 OCPP 充电桩模拟器（仿真软件），支持 OCPP 1.6J / 2.0.1，带实时 Web UI，支持 Windows、Linux 和 Docker。无需真实充电桩即可测试 CSMS 或 EMS（含 Smart Charging）。
          nav_translations:
            Home: 首页
            Getting started: 快速入门
            Configuration: 配置
            Reference: 参考
            About: 关于

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - quick-start.md
  - Configuration:
      - configuration.md
      - excel-templates.md
  - Reference:
      - messages.md
      - smart-charging.md
      - security-profiles.md
      - mini-csms.md
      - scenarios.md
      - traffic.md
      - http-api.md
      - mcp.md
      - development.md
      - changelog.md
  - About:
      - license.md
      - commercial-support.md
