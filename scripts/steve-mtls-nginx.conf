# Security Profile 3 (mTLS) front for SteVe; see scripts/steve.md. SteVe 3.15.0 has no TLS client-certificate
# check of its own, so this nginx terminates TLS, requires a client certificate chaining to client-ca.pem, checks
# that its CN equals the chargeBoxId in the URL, and proxies the WebSocket to SteVe over plain HTTP.
# The 1.6 mTLS endpoint is therefore this proxy (wss://localhost:8543/steve/websocket/CentralSystemService/<id>),
# not SteVe itself; SteVe sees the charge box as an unauthenticated (profile 0) connection.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1 when the client certificate CN (RFC 2253 DN, CN first) equals the last path segment.
map "$ssl_client_s_dn|$uri" $cp_identity_ok {
    "~^CN=(?<cn>[^,]+)(,.*)?\|/steve/websocket/CentralSystemService/\k<cn>$" 1;
    default 0;
}

server {
    listen 8443 ssl;
    # Resolve "app" per request (Docker DNS), so the proxy also starts while SteVe is still down / rebuilding.
    resolver 127.0.0.11 valid=10s;
    set $steve_upstream http://app:8180;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate        /etc/nginx/mtls/server.pem;
    ssl_certificate_key    /etc/nginx/mtls/server.key;
    ssl_client_certificate /etc/nginx/mtls/client-ca.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    location /steve/websocket/CentralSystemService/ {
        if ($cp_identity_ok = 0) {
            return 403;
        }
        proxy_pass $steve_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
