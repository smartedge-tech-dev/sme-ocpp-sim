name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # The sme-sim-common pytest plugin (asyncio timeout + hang dump) is activated automatically.
      - run: python -m pytest -q
      # The 2.0.1 station suites again as OCPP 2.1 (Station21 inherits Station201; 2.1 is a superset of 2.0.1).
      - run: python -m pytest -q tests/test_station201.py tests/test_station201_remote.py tests/test_station201_device_model.py tests/test_station201_smart_charging.py tests/test_station201_spec_rules.py
        env:
          OCPPSIM_V201_SUITE: "2.1"

  # The built wheel (not the source tree) must start and carry static/ and configs/ (plan M8).
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The sdist carries the built-in scenarios
        run: |
          python - <<'PY'
          import glob, tarfile
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for f in ("both-versions", "plug-charge-unplug", "remote-start-no-tx"):
              assert any(n.endswith(f"/scenarios/{f}.yaml") for n in names), f"scenarios/{f}.yaml missing from the sdist"
          print("sdist OK")
          PY
      - name: Install the wheel into a fresh venv (outside the source tree)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
      - name: Run the installed package
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python -m sme_ocpp_sim --help
          /tmp/wheel-venv/bin/sme-ocpp-sim --version
          /tmp/wheel-venv/bin/python - <<'PY'
          from importlib.resources import files
          import sme_ocpp_sim
          assert "site-packages" in sme_ocpp_sim.__file__, sme_ocpp_sim.__file__
          pkg = files("sme_ocpp_sim")
          assert pkg.joinpath("configs", "demo-site.yaml").is_file(), "configs/demo-site.yaml missing from the wheel"
          assert pkg.joinpath("static", "index.html").is_file(), "static/index.html missing from the wheel"
          assert pkg.joinpath("scenarios", "plug-charge-unplug.yaml").is_file(), "scenarios/ missing from the wheel"
          from sme_ocpp_sim.config import load_file
          load_file(str(pkg.joinpath("configs", "demo-site.yaml")))
          print("wheel OK")
          PY
      - name: License files are in the wheel's .dist-info
        run: |
          python - dist/*.whl <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for lic in ("LICENSE", "THIRD-PARTY-NOTICES"):
              assert any(".dist-info/" in n and n.endswith("/" + lic) for n in names), f"{lic} missing from .dist-info"
          print("license files OK")
          PY

  # The Dockerfile must build before a release tag does it (single arch, no push).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sme-ocpp-sim:ci .
      - run: docker run --rm sme-ocpp-sim:ci sme-ocpp-sim --version
